# The package's generated half is committed; a push that changed a source
# without regenerating, or edited an output by hand, fails here.
name: check

on:
  push:
    branches: [main]
  pull_request:
  # GITHUB_TOKEN-created release PRs do not trigger pull_request workflows.
  # Select changeset-release/main here to run its required package check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
      # `sharp` renders Buddy for `art/`; without it `build.mjs` cannot run and
      # the check that compares the committed outputs to a fresh build compares
      # nothing.
      - run: pnpm install --frozen-lockfile
      - name: Validate pending changesets
        if: hashFiles('.changeset/*.md', '!.changeset/README.md') != ''
        run: |
          git show-ref --verify --quiet refs/heads/main || git branch --no-track main origin/main
          pnpm changeset status
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.58.0'
      - run: just check
      - run: git diff --exit-code
      - run: pnpm pack --dry-run
