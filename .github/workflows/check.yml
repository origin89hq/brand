# The package's generated half is committed; a push that changed a source
# without regenerating, or edited an output by hand, fails here.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
      # `sharp` renders Buddy for `art/`; without it `build.mjs` cannot run and
      # the check that compares the committed outputs to a fresh build compares
      # nothing.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: git diff --exit-code
      - run: pnpm pack --dry-run
